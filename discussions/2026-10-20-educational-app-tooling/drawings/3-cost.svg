<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="960" height="470" fill="#fafaf7"/>
  <text x="30" y="38" font-size="22" font-weight="bold" fill="#222">3 · Three ways to inspect: start small, ask for more when useful</text>
  <text x="30" y="62" font-size="13" fill="#a33">Real costs depend on size, model and repetition. Nothing has been measured yet.</text>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#555"/></marker>
  </defs>

  <!-- three options -->
  <rect x="30" y="90" width="270" height="150" rx="12" fill="#e6f4ec" stroke="#2a9d5c" stroke-width="2"/>
  <text x="50" y="120" font-size="17" font-weight="bold" fill="#222">Reference</text>
  <text x="50" y="145" fill="#333">Sent with your message</text>
  <text x="50" y="163" fill="#333">when you point.</text>
  <text x="50" y="200" font-size="12" fill="#2a9d5c">"particle B · t=2.4 s · Scene.js:42"</text>
  <text x="50" y="222" font-size="12" fill="#2a9d5c" font-weight="bold">the starting point</text>

  <rect x="345" y="90" width="270" height="150" rx="12" fill="#f1eefa" stroke="#8a74c8" stroke-width="2"/>
  <text x="365" y="120" font-size="17" font-weight="bold" fill="#222">Code / state</text>
  <text x="365" y="145" fill="#333">When an agent needs to</text>
  <text x="365" y="163" fill="#333">understand behaviour.</text>
  <text x="365" y="200" font-size="12" fill="#6a54a8">a few lines of code,</text>
  <text x="365" y="216" font-size="12" fill="#6a54a8">B's position and speed</text>

  <rect x="660" y="90" width="270" height="150" rx="12" fill="#fdf1e4" stroke="#d08a3c" stroke-width="2"/>
  <text x="680" y="120" font-size="17" font-weight="bold" fill="#222">Image</text>
  <text x="680" y="145" fill="#333">When appearance matters,</text>
  <text x="680" y="163" fill="#333">cropped to the area.</text>
  <text x="680" y="200" font-size="12" fill="#a0601c">can be cheaper than several</text>
  <text x="680" y="216" font-size="12" fill="#a0601c">rounds of text confusion</text>

  <path d="M302 165 L340 165" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M617 165 L655 165" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="480" y="268" text-anchor="middle" font-size="13" fill="#555">Agents pick whichever resolves the question; the arrows show a typical order, not a rule.</text>

  <line x1="30" y1="295" x2="930" y2="295" stroke="#ccc"/>

  <text x="30" y="330" font-size="17" font-weight="bold" fill="#222">What we avoid</text>
  <rect x="30" y="345" width="420" height="44" rx="8" fill="#c04848" opacity="0.85"/>
  <text x="45" y="372" fill="#fff">Browser view always on, every turn, every agent</text>
  <line x1="30" y1="345" x2="450" y2="389" stroke="#fff" stroke-width="3"/>
  <rect x="490" y="345" width="440" height="44" rx="8" fill="#c04848" opacity="0.85"/>
  <text x="505" y="372" fill="#fff">Big text dumps sent to every agent by default</text>
  <line x1="490" y1="345" x2="930" y2="389" stroke="#fff" stroke-width="3"/>

  <text x="30" y="430" font-size="13" fill="#555">Browser tools stay switched off until needed, because just loading them costs context.</text>
</svg>
