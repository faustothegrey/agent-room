<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="960" height="400" fill="#fff"/>
  <style>
    .pane{fill:#f4f4f6;stroke:#888}
    .tab{fill:#e2e2e8;stroke:#888}
    .on{fill:#fff;stroke:#333;stroke-width:1.5}
    .term{fill:#1e1e1e;stroke:#333}
    .tt{fill:#9f9;font-family:Menlo,monospace;font-size:11}
    .h{font-weight:bold;font-size:15}
    .note{fill:#444;font-size:12}
  </style>

  <!-- A: bottom drawer -->
  <text x="20" y="28" class="h">A. Drawer under the left pane</text>
  <rect x="20" y="40" width="180" height="250" class="pane"/>
  <rect x="20" y="40" width="90" height="24" class="on"/><text x="30" y="57">Discussion</text>
  <rect x="110" y="40" width="90" height="24" class="tab"/><text x="125" y="57">Worker</text>
  <text x="30" y="100" class="note">messages…</text>
  <rect x="20" y="200" width="180" height="90" class="term"/>
  <text x="28" y="218" class="tt">$ git status</text>
  <text x="28" y="234" class="tt">On branch main</text>
  <rect x="205" y="40" width="100" height="250" class="pane"/>
  <rect x="205" y="40" width="50" height="24" class="on"/><text x="208" y="57" font-size="10">Explorer</text>
  <rect x="255" y="40" width="50" height="24" class="tab"/><text x="257" y="57" font-size="10">Document</text>
  <text x="20" y="315" class="note">+ chat, document and shell all visible</text>
  <text x="20" y="332" class="note">− less height for messages</text>

  <!-- B: third tab on the left -->
  <text x="340" y="28" class="h">B. Third tab beside Worker</text>
  <rect x="340" y="40" width="180" height="250" class="pane"/>
  <rect x="340" y="40" width="60" height="24" class="tab"/><text x="344" y="57" font-size="11">Discussion</text>
  <rect x="400" y="40" width="55" height="24" class="tab"/><text x="408" y="57" font-size="11">Worker</text>
  <rect x="455" y="40" width="65" height="24" class="on"/><text x="460" y="57" font-size="11">Terminal</text>
  <rect x="340" y="64" width="180" height="226" class="term"/>
  <text x="348" y="84" class="tt">$ npm test</text>
  <text x="348" y="100" class="tt"># pass 212</text>
  <rect x="525" y="40" width="100" height="250" class="pane"/>
  <rect x="525" y="40" width="50" height="24" class="tab"/><text x="528" y="57" font-size="10">Explorer</text>
  <rect x="575" y="40" width="50" height="24" class="on"/><text x="577" y="57" font-size="10">Document</text>
  <text x="535" y="100" class="note">notes.md</text>
  <text x="340" y="315" class="note">+ full height; document stays visible</text>
  <text x="340" y="332" class="note">− hides the chat while open</text>

  <!-- C: third tab on the right -->
  <text x="660" y="28" class="h">C. Third tab beside Document</text>
  <rect x="660" y="40" width="150" height="250" class="pane"/>
  <rect x="660" y="40" width="80" height="24" class="on"/><text x="668" y="57">Discussion</text>
  <rect x="740" y="40" width="70" height="24" class="tab"/><text x="752" y="57">Worker</text>
  <text x="670" y="100" class="note">messages…</text>
  <rect x="815" y="40" width="130" height="250" class="pane"/>
  <rect x="815" y="40" width="42" height="24" class="tab"/><text x="817" y="57" font-size="9">Explorer</text>
  <rect x="857" y="40" width="44" height="24" class="tab"/><text x="858" y="57" font-size="9">Document</text>
  <rect x="901" y="40" width="44" height="24" class="on"/><text x="903" y="57" font-size="9">Terminal</text>
  <rect x="815" y="64" width="130" height="226" class="term"/>
  <text x="821" y="84" class="tt">$ ls</text>
  <text x="660" y="315" class="note">+ chat stays visible</text>
  <text x="660" y="332" class="note">− hides the document; narrow pane</text>

  <text x="20" y="380" class="note">Layout today (README): left pane = Discussion | Worker tabs; right pane = Explorer | Document tabs. Proportions are illustrative.</text>
</svg>
