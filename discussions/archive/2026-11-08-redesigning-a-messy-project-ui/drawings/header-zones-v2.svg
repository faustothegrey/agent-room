  <text x="1028" y="66" fill="#aaa" font-size="10">5h</text><rect x="1050" y="59" width="30" height="5" fill="#333"/><rect x="1050" y="59" width="10" height="5" fill="#22c55e"/><text x="1084" y="66" fill="#ccc" font-size="10">32%  resets 6pm</text>
  <text x="1028" y="86" fill="#aaa" font-size="10">week</text><rect x="1050" y="79" width="30" height="5" fill="#333"/><rect x="1050" y="79" width="12" height="5" fill="#22c55e"/><text x="1084" y="86" fill="#ccc" font-size="10">38%  resets Nov 11 8am</text>
