<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1200" height="1180" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="bold">UI states, branch model (proposal, Claude, 2026-11-07)</text>
  <text x="600" y="50" text-anchor="middle" fill="#555">Built on today's dark layout. Example: the browser is on the Mac's room; the Pi has its own line of the discussion.</text>

  <!-- A header -->
  <text x="30" y="85" font-size="15" font-weight="bold">A. Header, second line</text>
  <rect x="30" y="95" width="1140" height="95" rx="6" fill="#16181d"/>
  <text x="50" y="118" fill="#888" font-size="12">A1 own line</text>
  <circle cx="146" cy="114" r="4" fill="#3fbf5f"/>
  <text x="156" y="118" fill="#bbb">Server up 2h · Mac 192.168.1.12:5566 ·</text>
  <rect x="425" y="105" width="150" height="18" rx="9" fill="#3b82f655"/>
  <text x="500" y="118" text-anchor="middle" fill="#cfe0ff">Mac's line, round 14</text>
  <text x="585" y="118" fill="#bbb">· agents run on Mac · Project 788e37d + uncommitted</text>
  <text x="50" y="160" fill="#888" font-size="12">A2 viewing</text>
  <circle cx="146" cy="156" r="4" fill="#3fbf5f"/>
  <text x="156" y="160" fill="#bbb">Server up 2h · Mac 192.168.1.12:5566 ·</text>
  <rect x="425" y="147" width="330" height="18" rx="9" fill="#2f9e4455"/>
  <text x="590" y="160" text-anchor="middle" fill="#bdf5c8">Viewing Pi's line, round 12, received 14:32 · read-only</text>
  <text x="765" y="160" fill="#bbb">· Pi: running a round</text>

  <!-- B discussions pane -->
  <text x="30" y="225" font-size="15" font-weight="bold">B. Discussions pane: one row per node's line</text>
  <rect x="30" y="235" width="560" height="215" rx="6" fill="#16181d"/>
  <text x="50" y="260" fill="#888" font-size="12">ACTIVE</text>
  <text x="50" y="284" fill="#ddd">💬 2026-11-06-teleporting-agent-room…</text>
  <circle cx="76" cy="304" r="4" fill="#3b82f6"/>
  <text x="86" y="308" fill="#ddd">Mac (this node) · round 14 · sent to Pi ✓</text>
  <circle cx="76" cy="330" r="4" fill="#2f9e44"/>
  <text x="86" y="334" fill="#ddd">Pi · round 12 · received 14:32 · Pi idle</text>
  <rect x="390" y="320" width="50" height="20" rx="4" fill="#2a2f3a" stroke="#666"/>
  <text x="415" y="334" text-anchor="middle" fill="#ddd" font-size="12">View</text>
  <rect x="448" y="320" width="120" height="20" rx="4" fill="#3b82f6"/>
  <text x="508" y="334" text-anchor="middle" fill="#fff" font-size="12">Continue here…</text>
  <text x="50" y="380" fill="#888" font-size="12">PEERS</text>
  <circle cx="56" cy="400" r="4" fill="#3fbf5f"/>
  <text x="66" y="404" fill="#ddd">Pi · 192.168.1.20:5566 · paired</text>
  <circle cx="56" cy="426" r="4" fill="#e5484d"/>
  <text x="66" y="430" fill="#999">Mini · 192.168.1.30:5566 · unreachable since 09:10 · </text>
  <text x="380" y="430" fill="#6aa0ff">Pair with Mini…</text>

  <!-- C bottom bar -->
  <text x="610" y="225" font-size="15" font-weight="bold">C. Bottom bar while viewing another line</text>
  <rect x="610" y="235" width="560" height="110" rx="6" fill="#16181d"/>
  <rect x="625" y="247" width="530" height="40" rx="6" fill="#1f2937" stroke="#2f9e44"/>
  <text x="640" y="272" fill="#ddd">Pi's line, round 12, received 14:32. Read-only.</text>
  <rect x="625" y="300" width="250" height="30" rx="5" fill="#3b82f6"/>
  <text x="750" y="320" text-anchor="middle" fill="#fff" font-weight="bold">Continue here from this round…</text>
  <rect x="885" y="300" width="160" height="30" rx="5" fill="#2a2f3a" stroke="#666"/>
  <text x="965" y="320" text-anchor="middle" fill="#ddd">Back to Mac's line</text>
  <text x="610" y="365" fill="#555" font-size="12">Summarize and agent controls hidden while viewing; Usage, Restart, Quit stay.</text>

  <!-- D continue panel -->
  <text x="30" y="490" font-size="15" font-weight="bold">D. "Continue here…" panel: the case is computed and stated before you confirm</text>
  <rect x="30" y="500" width="370" height="230" rx="8" fill="#16181d" stroke="#3b82f6"/>
  <text x="50" y="525" fill="#fff" font-weight="bold">D1. Mac is behind</text>
  <text x="50" y="550" fill="#bbb">Mac's line will move forward to</text>
  <text x="50" y="568" fill="#bbb">Pi's round 12, and you continue here.</text>
  <text x="50" y="598" fill="#f0c674" font-size="12">Pi is running a round right now. It will keep</text>
  <text x="50" y="614" fill="#f0c674" font-size="12">going on its own; this doesn't stop it.</text>
  <text x="50" y="640" fill="#999" font-size="12">Mac's unsaved changes will first be saved</text>
  <text x="50" y="656" fill="#999" font-size="12">as an interrupted round.</text>
  <rect x="160" y="685" width="80" height="28" rx="5" fill="#2a2f3a" stroke="#666"/>
  <text x="200" y="704" text-anchor="middle" fill="#ddd">Cancel</text>
  <rect x="250" y="685" width="130" height="28" rx="5" fill="#3b82f6"/>
  <text x="315" y="704" text-anchor="middle" fill="#fff" font-weight="bold">Continue here</text>

  <rect x="415" y="500" width="370" height="230" rx="8" fill="#16181d" stroke="#3b82f6"/>
  <text x="435" y="525" fill="#fff" font-weight="bold">D2. Mac already contains it</text>
  <text x="435" y="550" fill="#bbb">Mac's line already includes Pi's</text>
  <text x="435" y="568" fill="#bbb">round 12. You continue Mac's line</text>
  <text x="435" y="586" fill="#bbb">(round 14). Nothing is rewound.</text>
  <rect x="545" y="685" width="80" height="28" rx="5" fill="#2a2f3a" stroke="#666"/>
  <text x="585" y="704" text-anchor="middle" fill="#ddd">Cancel</text>
  <rect x="635" y="685" width="130" height="28" rx="5" fill="#3b82f6"/>
  <text x="700" y="704" text-anchor="middle" fill="#fff" font-weight="bold">Continue here</text>

  <rect x="800" y="500" width="370" height="230" rx="8" fill="#16181d" stroke="#e5484d"/>
  <text x="820" y="525" fill="#fff" font-weight="bold">D3. Both have new rounds</text>
  <text x="820" y="550" fill="#ffb4b4">Reconciliation required: Mac and Pi</text>
  <text x="820" y="568" fill="#ffb4b4">each have rounds the other doesn't.</text>
  <text x="820" y="592" fill="#bbb">Nothing will be changed.</text>
  <rect x="930" y="685" width="80" height="28" rx="5" fill="#2a2f3a" stroke="#666"/>
  <text x="970" y="704" text-anchor="middle" fill="#ddd">Cancel</text>
  <rect x="1020" y="685" width="130" height="28" rx="5" fill="#e5484d"/>
  <text x="1085" y="704" text-anchor="middle" fill="#fff" font-weight="bold">Show both lines</text>

  <!-- E reconciliation -->
  <text x="30" y="770" font-size="15" font-weight="bold">E. Reconciliation required: both lines from their last common round (nothing is discarded)</text>
  <rect x="30" y="780" width="1140" height="200" rx="6" fill="#16181d"/>
  <text x="50" y="805" fill="#aaa">Common round 11 · "Agreed: git replication is official…"</text>
  <rect x="50" y="815" width="540" height="110" rx="5" fill="#1f2937" stroke="#3b82f6"/>
  <text x="65" y="838" fill="#cfe0ff" font-weight="bold">Mac's line</text>
  <text x="65" y="860" fill="#ddd">Round 12 summary: "Agreed: branch per node…"</text>
  <text x="65" y="880" fill="#ddd">Round 13 summary: "Agreed: Continue here merges…"</text>
  <text x="65" y="905" fill="#999" font-size="12">changed: proposal.md, ui-design.md</text>
  <rect x="610" y="815" width="540" height="110" rx="5" fill="#1f2937" stroke="#2f9e44"/>
  <text x="625" y="838" fill="#bdf5c8" font-weight="bold">Pi's line</text>
  <text x="625" y="860" fill="#ddd">Round 12 summary: "Unattended: compared Rex and SSH…"</text>
  <text x="625" y="905" fill="#999" font-size="12">changed: notes.md · added: drawings/rex.svg</text>
  <rect x="50" y="938" width="200" height="28" rx="5" fill="#3b82f6"/>
  <text x="150" y="957" text-anchor="middle" fill="#fff">Continue Mac's own line</text>
  <rect x="260" y="938" width="170" height="28" rx="5" fill="#2a2f3a" stroke="#666"/>
  <text x="345" y="957" text-anchor="middle" fill="#ddd">Fork from Pi's line…</text>
  <rect x="440" y="938" width="270" height="28" rx="5" fill="#2a2f3a" stroke="#d99a00"/>
  <text x="575" y="957" text-anchor="middle" fill="#ffd27a">Accept this line as reconciled…</text>
  <text x="725" y="950" fill="#999" font-size="11">Keeps Mac's files; records Pi's round 12 as accounted for.</text>
  <text x="725" y="965" fill="#999" font-size="11">To combine first: ask Mac's agents to read Pi's rounds.</text>

  <!-- F status lines -->
  <text x="30" y="1015" font-size="15" font-weight="bold">F. End-of-round status lines (in the conversation)</text>
  <rect x="30" y="1025" width="560" height="125" rx="6" fill="#16181d"/>
  <text x="50" y="1050" fill="#aaa">Round 14 saved · sent to Pi ✓</text>
  <text x="50" y="1075" fill="#aaa">Round 14 saved · Pi unreachable, will send when it's back</text>
  <text x="50" y="1100" fill="#e0a0a0">Round 14 saved as interrupted (error: …)</text>
  <text x="50" y="1125" fill="#aaa">(The worker runs in its own worktree: saving never waits for it.)</text>

  <!-- G startup -->
  <text x="610" y="1015" font-size="15" font-weight="bold">G. Startup output and pairing</text>
  <rect x="610" y="1025" width="560" height="125" rx="6" fill="#f7f7f7" stroke="#ccc"/>
  <text x="630" y="1050" font-family="Menlo, monospace" font-size="12">agent-room on Pi, listening on 0.0.0.0:5566</text>
  <text x="630" y="1070" font-family="Menlo, monospace" font-size="12">  open:  http://192.168.1.20:5566/__room</text>
  <text x="630" y="1090" font-family="Menlo, monospace" font-size="12">  peers: Mac 192.168.1.12:5566 (reachable, paired)</text>
  <text x="630" y="1120" font-size="12" fill="#555">"Pair with …" shows both room folders and asks you to confirm they are</text>
  <text x="630" y="1137" font-size="12" fill="#555">the same project; a room-ID mismatch is refused, nothing is replaced.</text>
</svg>
