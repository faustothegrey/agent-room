<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="880" height="420" fill="#fff"/>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="bold">Stage B0: replication prototype (one machine, two temporary folders)</text>

  <!-- node 1 -->
  <rect x="30" y="60" width="230" height="230" rx="10" fill="#eef4ff" stroke="#4a6fb5"/>
  <text x="145" y="85" text-anchor="middle" font-weight="bold">Node 1 (temporary)</text>
  <text x="50" y="115">discussion folder</text>
  <text x="50" y="135" font-size="12" fill="#555">fake rounds: edit, add, delete</text>
  <text x="50" y="170">its own Git storage</text>
  <text x="50" y="190" font-size="12" fill="#555">one commit per round</text>
  <text x="50" y="225">makes a bundle:</text>
  <text x="50" y="245" font-size="12" fill="#555">first: full</text>
  <text x="50" y="263" font-size="12" fill="#555">then: only what's new</text>

  <!-- transfer -->
  <line x1="260" y1="150" x2="380" y2="150" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="320" y="140" text-anchor="middle" font-size="12">HTTP (local)</text>
  <line x1="380" y1="230" x2="260" y2="230" stroke="#444" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="320" y="250" text-anchor="middle" font-size="12">"got commit X"</text>

  <!-- node 2 -->
  <rect x="380" y="60" width="470" height="230" rx="10" fill="#effaef" stroke="#3f8f4a"/>
  <text x="615" y="85" text-anchor="middle" font-weight="bold">Node 2 (temporary)</text>
  <g font-size="13">
    <rect x="400" y="105" width="95" height="50" rx="6" fill="#fff" stroke="#888"/>
    <text x="447" y="127" text-anchor="middle">1. save to</text><text x="447" y="144" text-anchor="middle">temp place</text>
    <rect x="510" y="105" width="95" height="50" rx="6" fill="#fff" stroke="#888"/>
    <text x="557" y="127" text-anchor="middle">2. check</text><text x="557" y="144" text-anchor="middle">files, base</text>
    <rect x="620" y="105" width="95" height="50" rx="6" fill="#fff" stroke="#888"/>
    <text x="667" y="127" text-anchor="middle">3. import as</text><text x="667" y="144" text-anchor="middle">"received"</text>
    <rect x="730" y="105" width="105" height="50" rx="6" fill="#fff" stroke="#888"/>
    <text x="782" y="127" text-anchor="middle">4. full read-only</text><text x="782" y="144" text-anchor="middle">snapshot</text>
    <line x1="495" y1="130" x2="510" y2="130" stroke="#444" marker-end="url(#a)"/>
    <line x1="605" y1="130" x2="620" y2="130" stroke="#444" marker-end="url(#a)"/>
    <line x1="715" y1="130" x2="730" y2="130" stroke="#444" marker-end="url(#a)"/>
    <rect x="620" y="190" width="215" height="50" rx="6" fill="#fff" stroke="#888"/>
    <text x="727" y="212" text-anchor="middle">5. switch "current" pointer,</text><text x="727" y="229" text-anchor="middle">then acknowledge</text>
    <line x1="782" y1="155" x2="782" y2="190" stroke="#444" marker-end="url(#a)"/>
    <text x="400" y="200" font-size="12" fill="#a33">any failure → stop here;</text>
    <text x="400" y="217" font-size="12" fill="#a33">the previous snapshot</text>
    <text x="400" y="234" font-size="12" fill="#a33">stays readable</text>
  </g>

  <!-- bottom -->
  <rect x="30" y="310" width="820" height="90" rx="10" fill="#fff8e6" stroke="#c9a23a"/>
  <text x="50" y="335" font-weight="bold">Out of scope: the real room, its src/ files, ports, UI, LAN, pairing (all stage B proper)</text>
  <text x="50" y="360">Failure cases tested: interrupted · corrupted · duplicate · missing base → full · rewritten history refused · restart mid-receive</text>
  <text x="50" y="385">Output for the User: stage-b0-report.md (works? sizes, time, lines of code, file-boundary recommendation, not checked)</text>
</svg>
