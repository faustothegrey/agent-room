<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="960" height="470" fill="#fff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold">Header mock: who owns, who runs, how fresh</text>
  <text x="480" y="52" text-anchor="middle" fill="#555">Proposal (Claude + Codex). Grey = from the copied metadata; green/red = checked live</text>

  <!-- owner view -->
  <text x="40" y="95" font-weight="bold">1. Browser on the Pi (the owner)</text>
  <rect x="40" y="105" width="880" height="70" rx="8" fill="#f7f7f7" stroke="#bbb"/>
  <text x="60" y="133">Viewing on <tspan font-weight="bold">Pi</tspan></text>
  <rect x="220" y="117" width="170" height="24" rx="12" fill="#2f9e4433"/>
  <text x="305" y="134" text-anchor="middle">Owner: Pi (this node)</text>
  <circle cx="420" cy="129" r="5" fill="#2f9e44"/>
  <text x="432" y="134">Claude running on Pi</text>
  <circle cx="600" cy="129" r="5" fill="#2f9e44"/>
  <text x="612" y="134">Codex running on Pi</text>
  <text x="60" y="162" fill="#555" font-size="12">message box enabled</text>

  <!-- secondary connected -->
  <text x="40" y="215" font-weight="bold">2. Browser on the Mac (secondary, connected)</text>
  <rect x="40" y="225" width="880" height="70" rx="8" fill="#f7f7f7" stroke="#bbb"/>
  <text x="60" y="253">Viewing on <tspan font-weight="bold">Mac</tspan></text>
  <rect x="220" y="237" width="120" height="24" rx="12" fill="#3b82f633"/>
  <text x="280" y="254" text-anchor="middle">Owner: Pi</text>
  <text x="360" y="254" fill="#555">Last synchronized 14:32:05</text>
  <circle cx="575" cy="249" r="5" fill="#2f9e44"/>
  <text x="587" y="254">Claude on Pi</text>
  <circle cx="700" cy="249" r="5" fill="#2f9e44"/>
  <text x="712" y="254">Codex on Pi</text>
  <text x="60" y="282" fill="#555" font-size="12">read-only here (or: messages forwarded to the Pi, the User's choice)</text>

  <!-- secondary disconnected -->
  <text x="40" y="335" font-weight="bold">3. Browser on the Mac (secondary, Pi unreachable)</text>
  <rect x="40" y="345" width="880" height="90" rx="8" fill="#fff4f4" stroke="#e0a0a0"/>
  <text x="60" y="373">Viewing on <tspan font-weight="bold">Mac</tspan></text>
  <rect x="220" y="357" width="250" height="24" rx="12" fill="#ef444433"/>
  <text x="345" y="374" text-anchor="middle">Owner: Pi · connection lost</text>
  <text x="490" y="374" fill="#555">Last synchronized 14:32:05</text>
  <circle cx="700" cy="369" r="5" fill="#999"/>
  <text x="712" y="374" fill="#555">agents: unknown</text>
  <text x="60" y="402" fill="#555" font-size="12">Latest copied message: "[Codex] One qualification to Claude's wording…"</text>
  <rect x="720" y="392" width="180" height="30" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="810" y="412" text-anchor="middle" fill="#c0392b" font-weight="bold">Take over here…</text>
  <text x="60" y="424" fill="#555" font-size="12">ownership is NOT shown as ended; only your click changes it</text>
</svg>
