<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 800" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="1060" height="800" fill="#fff"/>
  <text x="20" y="28" font-size="17" font-weight="bold">The worker and auto dev: src/ui.mjs (checked 2026-11-13)</text>
  <text x="20" y="46" fill="#555">Part A: how one instruction reaches the worker and comes back. Part B: how auto dev chains instructions without the User.</text>

  <!-- PART A -->
  <text x="20" y="76" font-size="14" font-weight="bold" fill="#1168bd">A. One instruction for the worker</text>

  <!-- sources -->
  <rect x="20" y="88" width="190" height="124" rx="6" fill="#f3f7fb" stroke="#1168bd"/>
  <text x="32" y="108" font-weight="bold" fill="#1168bd">1. Sent by</text>
  <text x="32" y="126">• the User, in the Worker tab</text>
  <text x="32" y="142">• auto dev, from an agreed</text>
  <text x="42" y="156">summary's Next step (Part B)</text>
  <text x="32" y="172">• archive with rollback</text>
  <text x="32" y="194" font-size="11" fill="#555">A typed instruction pauses</text>
  <text x="32" y="207" font-size="11" fill="#555">a running auto dev.</text>
  <line x1="210" y1="146" x2="236" y2="146" stroke="#444" marker-end="url(#a)"/>

  <!-- queue -->
  <rect x="238" y="88" width="240" height="124" rx="6" fill="#f3f7fb" stroke="#1168bd"/>
  <text x="250" y="108" font-weight="bold" fill="#1168bd">2. The lane's queue</text>
  <text x="250" y="126">One lane per discussion; one task at a</text>
  <text x="250" y="142">time per lane, in the order sent.</text>
  <text x="250" y="158">At most 2 tasks in the folder at once</text>
  <text x="250" y="172">(PARALLEL_WORKERS); never two of</text>
  <text x="250" y="186">one worker session at once.</text>
  <line x1="478" y1="146" x2="504" y2="146" stroke="#444" marker-end="url(#a)"/>

  <!-- worktree -->
  <rect x="506" y="88" width="270" height="124" rx="6" fill="#e8e8e8" stroke="#888"/>
  <text x="518" y="108" font-weight="bold">3. The lane's Git worktree</text>
  <text x="518" y="126" font-family="monospace" font-size="11">&lt;repo&gt;.workers/&lt;name&gt;/ · worker/&lt;name&gt;</text>
  <text x="518" y="141" font-size="10">(brainstorm, before a title: &lt;repo&gt;.worker/, worker/main)</text>
  <text x="518" y="158" font-size="11">Created at the first instruction (worktree add</text>
  <text x="518" y="172" font-size="11">-b from HEAD); reused after Reload / Restart.</text>
  <text x="518" y="188" font-size="11">Uncommitted edits left by a task hold the lane</text>
  <text x="518" y="200" font-size="11">until their origin resolves them; other lanes go on.</text>
  <line x1="776" y1="146" x2="802" y2="146" stroke="#444" marker-end="url(#a)"/>

  <!-- worker turn -->
  <rect x="804" y="88" width="236" height="124" rx="6" fill="#fdf6ec" stroke="#b07a1f"/>
  <text x="816" y="108" font-weight="bold" fill="#b07a1f">4. The worker's turn</text>
  <text x="816" y="126">One CLI process (agents.mjs),</text>
  <text x="816" y="142">30 min timeout, its own session,</text>
  <text x="816" y="158">README-for-worker-agents.md.</text>
  <text x="816" y="174">Commits on its branch, message</text>
  <text x="816" y="190">labelled [&lt;discussion&gt;].</text>
  <line x1="922" y1="212" x2="922" y2="236" stroke="#444" marker-end="url(#a)"/>

  <!-- report -->
  <rect x="660" y="238" width="380" height="76" rx="6" fill="#f3f7fb" stroke="#1168bd"/>
  <text x="672" y="258" font-weight="bold" fill="#1168bd">5. The worker's reply</text>
  <text x="672" y="276">Shown in the Worker tab. If auto dev sent it, it also opens a</text>
  <text x="672" y="292">discussion round as a "Worker report", sent to every agent.</text>
  <text x="672" y="308" font-size="11" fill="#555">The worktree is checked again before the lane's next task.</text>
  <line x1="660" y1="276" x2="532" y2="276" stroke="#444" marker-end="url(#a)"/>

  <rect x="330" y="246" width="200" height="60" rx="6" fill="#e6f4ea" stroke="#2e7d32"/>
  <text x="430" y="268" text-anchor="middle" font-weight="bold" fill="#2e7d32">6. The User reviews</text>
  <text x="430" y="284" text-anchor="middle">and merges into main.</text>
  <text x="430" y="299" text-anchor="middle" font-size="11" fill="#555">agent-room never merges.</text>

  <rect x="20" y="236" width="290" height="84" rx="6" fill="#fafafa" stroke="#888" stroke-dasharray="5 3"/>
  <text x="32" y="256" font-weight="bold">What agent-room's own code does in Git</text>
  <text x="32" y="273" font-size="11">Only "worktree add", and a fast-forward of a lane</text>
  <text x="32" y="288" font-size="11">with nothing of its own. Never reset, merge, rebase,</text>
  <text x="32" y="303" font-size="11">delete, nor touch the room's own working copy.</text>
  <text x="32" y="316" font-size="10.5" fill="#555">(The worker itself may, when a task asks.)</text>

  <!-- PART B -->
  <line x1="20" y1="342" x2="1040" y2="342" stroke="#ccc"/>
  <text x="20" y="368" font-size="14" font-weight="bold" fill="#1168bd">B. Auto dev: at most 5 worker cycles per start (AUTO_DEV_CYCLES)</text>

  <rect x="20" y="384" width="240" height="132" rx="6" fill="#f3f7fb" stroke="#1168bd"/>
  <text x="32" y="404" font-weight="bold" fill="#1168bd">Start auto dev (/autodev)</text>
  <text x="32" y="420" font-size="11">Refused unless: a saved discussion (not a</text>
  <text x="32" y="434" font-size="11">brainstorm), from the browser screen, not</text>
  <text x="32" y="448" font-size="11">already running, worker enabled, and the</text>
  <text x="32" y="462" font-size="11">latest agreed summary has a readable,</text>
  <text x="32" y="476" font-size="11">not-yet-sent worker instruction.</text>
  <text x="32" y="500" font-size="11" fill="#555">Restarting gives another 5 cycles.</text>
  <line x1="260" y1="440" x2="296" y2="440" stroke="#444" marker-end="url(#a)"/>

  <rect x="298" y="400" width="200" height="80" rx="6" fill="#f3f7fb" stroke="#1168bd"/>
  <text x="310" y="420" font-weight="bold" fill="#1168bd">relay()</text>
  <text x="310" y="437" font-size="11">cycle + 1; an "Auto dev sent …"</text>
  <text x="310" y="451" font-size="11">notice goes in the transcript;</text>
  <text x="310" y="465" font-size="11">the instruction joins the queue (A).</text>
  <line x1="498" y1="440" x2="534" y2="440" stroke="#444" marker-end="url(#a)"/>

  <rect x="536" y="400" width="200" height="80" rx="6" fill="#fdf6ec" stroke="#b07a1f"/>
  <text x="548" y="420" font-weight="bold" fill="#b07a1f">Worker runs, then</text>
  <text x="548" y="437" font-size="11">its reply (or failure) becomes</text>
  <text x="548" y="451" font-size="11">a "Worker report" round:</text>
  <text x="548" y="465" font-size="11">the agents discuss it.</text>
  <line x1="736" y1="440" x2="772" y2="440" stroke="#444" marker-end="url(#a)"/>

  <rect x="774" y="392" width="266" height="96" rx="6" fill="#f3f7fb" stroke="#1168bd"/>
  <text x="786" y="412" font-weight="bold" fill="#1168bd">Auto-summary + Outcome line</text>
  <text x="786" y="429" font-size="11">summary() with autoDevTask: the last line</text>
  <text x="786" y="443" font-size="11">must be Outcome: SEND, FINISH or</text>
  <text x="786" y="457" font-size="11">WAIT FOR USER. Passing on a version</text>
  <text x="786" y="471" font-size="11">accepts its quoted instruction as it stands.</text>
  <line x1="907" y1="488" x2="907" y2="524" stroke="#444" marker-end="url(#a)"/>

  <!-- decide -->
  <polygon points="907,526 1010,570 907,614 804,570" fill="#fff8e6" stroke="#b07a1f"/>
  <text x="907" y="566" text-anchor="middle" font-weight="bold">decide()</text>
  <text x="907" y="582" text-anchor="middle" font-size="11">agreed? Outcome?</text>

  <!-- SEND back -->
  <polyline points="804,570 400,570 400,482" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="420" y="562" font-size="11" fill="#2e7d32" font-weight="bold">SEND + a readable instruction + cycle &lt; 5 → next cycle</text>

  <!-- FINISH -->
  <line x1="907" y1="614" x2="907" y2="650" stroke="#444" marker-end="url(#a)"/>
  <text x="913" y="636" font-size="11" fill="#444">FINISH</text>
  <rect x="800" y="652" width="240" height="56" rx="6" fill="#e6f4ea" stroke="#2e7d32"/>
  <text x="920" y="673" text-anchor="middle" font-weight="bold" fill="#2e7d32">finished</text>
  <text x="920" y="690" text-anchor="middle" font-size="11">"Review and merge worker/&lt;name&gt;</text>
  <text x="920" y="703" text-anchor="middle" font-size="11">yourself."</text>

  <!-- PAUSE -->
  <polyline points="860,594 760,640" fill="none" stroke="#c0392b" marker-end="url(#a)"/>
  <rect x="300" y="610" width="460" height="168" rx="6" fill="#fde8e8" stroke="#c0392b"/>
  <text x="312" y="630" font-weight="bold" fill="#c0392b">paused (the reason is shown); nothing more is sent</text>
  <text x="312" y="649" font-size="11.5">From decide(): WAIT FOR USER · summary not agreed · empty ·</text>
  <text x="312" y="665" font-size="11.5">a summary turn failed · no Outcome line · SEND without an</text>
  <text x="312" y="681" font-size="11.5">instruction, or one that can't be read · 5 cycles used.</text>
  <text x="312" y="703" font-size="11.5">From outside: the User types a message or sends an instruction</text>
  <text x="312" y="719" font-size="11.5">(a worker already running finishes; its report is still discussed);</text>
  <text x="312" y="735" font-size="11.5">a turn of a round fails.</text>
  <text x="312" y="757" font-size="11.5">While paused, summaries may only say FINISH or WAIT FOR USER</text>
  <text x="312" y="771" font-size="11.5">(pausedTask). Resume, Start fresh or New discussion end the run.</text>

  <!-- Legend -->
  <rect x="20" y="610" width="260" height="96" fill="#fafafa" stroke="#ccc"/>
  <text x="32" y="630" font-weight="bold">Legend</text>
  <rect x="32" y="640" width="14" height="14" fill="#f3f7fb" stroke="#1168bd"/><text x="52" y="652" font-size="11">room harness code (enforced)</text>
  <rect x="32" y="662" width="14" height="14" fill="#fdf6ec" stroke="#b07a1f"/><text x="52" y="674" font-size="11">an agent's turn (instructions: asked)</text>
  <rect x="32" y="684" width="14" height="14" fill="#e8e8e8" stroke="#888"/><text x="52" y="696" font-size="11">files / Git on disk</text>
</svg>
