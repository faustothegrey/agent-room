<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="1000" height="770" fill="#fff"/>
  <text x="20" y="30" font-size="18" font-weight="bold">agent-room — containers + components (C4 levels 2–3), checked against src/ on 2026-11-13</text>

  <!-- User -->
  <rect x="20" y="60" width="150" height="70" rx="35" fill="#08427b"/>
  <text x="95" y="92" fill="#fff" text-anchor="middle" font-weight="bold">User</text>
  <text x="95" y="110" fill="#fff" text-anchor="middle" font-size="11">human participant</text>

  <!-- Browser -->
  <rect x="20" y="180" width="150" height="100" fill="#438dd5"/>
  <text x="95" y="208" fill="#fff" text-anchor="middle" font-weight="bold">Browser page</text>
  <text x="95" y="226" fill="#fff" text-anchor="middle" font-size="11">Discussion · Worker ·</text>
  <text x="95" y="240" fill="#fff" text-anchor="middle" font-size="11">Explorer · Terminal ·</text>
  <text x="95" y="254" fill="#fff" text-anchor="middle" font-size="11">Notes</text>
  <text x="95" y="270" fill="#fff" text-anchor="middle" font-size="10">(served by docs.mjs)</text>
  <line x1="95" y1="130" x2="95" y2="178" stroke="#444" marker-end="url(#a)"/>

  <!-- Harness boundary -->
  <rect x="220" y="55" width="400" height="500" fill="#f3f7fb" stroke="#1168bd" stroke-dasharray="8 4"/>
  <text x="232" y="78" fill="#1168bd" font-weight="bold">ROOM HARNESS: agent-room (one Node process, many rooms)</text>
  <text x="240" y="96" fill="#1168bd" font-size="10">enforces: turn order, PASS stop, turn cap, summary rounds, tools, worker queues</text>

  <rect x="240" y="110" width="170" height="60" fill="#1168bd"/>
  <text x="325" y="135" fill="#fff" text-anchor="middle" font-weight="bold">cli.mjs</text>
  <text x="325" y="152" fill="#fff" text-anchor="middle" font-size="11">rooms, queue, Reload/Restart</text>

  <rect x="430" y="110" width="170" height="60" fill="#1168bd"/>
  <text x="515" y="135" fill="#fff" text-anchor="middle" font-weight="bold">docs.mjs</text>
  <text x="515" y="152" fill="#fff" text-anchor="middle" font-size="11">HTTP, UI, live events</text>

  <rect x="240" y="190" width="170" height="60" fill="#1168bd"/>
  <text x="325" y="215" fill="#fff" text-anchor="middle" font-weight="bold">room.mjs</text>
  <text x="325" y="232" fill="#fff" text-anchor="middle" font-size="11">turns, passes, summaries</text>

  <rect x="430" y="190" width="170" height="60" fill="#1168bd"/>
  <text x="515" y="215" fill="#fff" text-anchor="middle" font-weight="bold">ui.mjs</text>
  <text x="515" y="232" fill="#fff" text-anchor="middle" font-size="11">discussions, workers, auto dev</text>

  <rect x="240" y="270" width="170" height="60" fill="#1168bd"/>
  <text x="325" y="295" fill="#fff" text-anchor="middle" font-weight="bold">agents.mjs</text>
  <text x="325" y="312" fill="#fff" text-anchor="middle" font-size="11">spawns CLIs, grants tools</text>

  <rect x="430" y="270" width="170" height="60" fill="#1168bd"/>
  <text x="515" y="295" fill="#fff" text-anchor="middle" font-weight="bold">host-shell.mjs</text>
  <text x="515" y="312" fill="#fff" text-anchor="middle" font-size="11">Terminal pty (this computer)</text>

  <rect x="240" y="350" width="170" height="60" fill="#1168bd"/>
  <text x="325" y="375" fill="#fff" text-anchor="middle" font-weight="bold">replicate.mjs</text>
  <text x="325" y="392" fill="#fff" text-anchor="middle" font-size="11">optional, --node/--peer</text>

  <rect x="430" y="350" width="170" height="60" fill="#1168bd"/>
  <text x="515" y="375" fill="#fff" text-anchor="middle" font-weight="bold">usage.mjs</text>
  <text x="515" y="392" fill="#fff" text-anchor="middle" font-size="11">tokens, quota meter</text>

  <rect x="240" y="430" width="170" height="60" fill="#1168bd"/>
  <text x="325" y="455" fill="#fff" text-anchor="middle" font-weight="bold">notes.mjs</text>
  <text x="325" y="472" fill="#fff" text-anchor="middle" font-size="11">Notes pane (this computer)</text>

  <text x="232" y="515" fill="#1168bd" font-size="11">Role instructions (rulebooks/), sent with every turn:</text>
  <text x="232" y="531" fill="#1168bd" font-size="10">citizenship + group-chat + discussing (room) · citizenship + worker (worker)</text>
  <text x="232" y="545" fill="#1168bd" font-size="10">+ per-turn prompts from room.mjs, ui.mjs (intro, summary format, auto dev)</text>

  <polyline points="170,200 228,200 228,103 515,103 515,108" fill="none" stroke="#444" marker-end="url(#a)"/>
  <text x="174" y="194" font-size="10" fill="#444">HTTP + events</text>

  <!-- Provider CLIs -->
  <rect x="680" y="60" width="300" height="270" fill="#fdf6ec" stroke="#b07a1f" stroke-dasharray="8 4"/>
  <text x="692" y="82" fill="#b07a1f" font-weight="bold">PROVIDER CLI HARNESSES (required)</text>
  <rect x="695" y="94" width="270" height="40" fill="#999"/>
  <text x="705" y="111" fill="#fff" font-weight="bold">claude -p</text>
  <text x="705" y="126" fill="#fff" font-size="10">--append-system-prompt · --tools / --allowedTools</text>
  <rect x="695" y="140" width="270" height="40" fill="#999"/>
  <text x="705" y="157" fill="#fff" font-weight="bold">codex exec</text>
  <text x="705" y="172" fill="#fff" font-size="10">-c developer_instructions · sandbox: full access</text>
  <rect x="695" y="186" width="270" height="40" fill="#999"/>
  <text x="705" y="203" fill="#fff" font-weight="bold">agy</text>
  <text x="705" y="218" fill="#fff" font-size="10">instructions in the prompt, when changed</text>
  <text x="692" y="248" fill="#b07a1f" font-size="11">Discussion agents and workers alike; Claude gets Bash.</text>
  <text x="692" y="264" fill="#b07a1f" font-size="11">Role instructions: asked, not enforced.</text>
  <text x="692" y="280" fill="#b07a1f" font-size="11">Skills: agent-room ships none; providers may add theirs.</text>
  <text x="692" y="296" fill="#b07a1f" font-size="11">One process per turn; sessions resumed by ID.</text>
  <text x="692" y="312" fill="#b07a1f" font-size="10">Detail: agent-turn-providers.svg</text>
  <polyline points="410,300 420,300 420,260 610,260 610,160 693,160" fill="none" stroke="#444" marker-end="url(#a)"/>
  <text x="640" y="250" font-size="10" fill="#444" transform="rotate(-90 640 250)">stdin → reply JSON</text>

  <!-- Externals -->
  <rect x="680" y="360" width="140" height="50" fill="#999"/>
  <text x="750" y="382" fill="#fff" text-anchor="middle" font-weight="bold">Quota meter</text>
  <text x="750" y="398" fill="#fff" text-anchor="middle" font-size="10">optional, :9899</text>
  <line x1="600" y1="380" x2="678" y2="385" stroke="#444" marker-end="url(#a)"/>
  <rect x="840" y="360" width="140" height="50" fill="#999"/>
  <text x="910" y="382" fill="#fff" text-anchor="middle" font-weight="bold">Peer servers</text>
  <text x="910" y="398" fill="#fff" text-anchor="middle" font-size="10">other agent-room nodes</text>

  <!-- Storage -->
  <text x="20" y="582" font-weight="bold">Storage (files, not processes) — detail: storage-map.svg</text>
  <rect x="20" y="592" width="215" height="84" fill="#e8e8e8" stroke="#888"/>
  <text x="127" y="615" text-anchor="middle" font-weight="bold">Room root</text>
  <text x="127" y="632" text-anchor="middle" font-size="11">the work + discussions/</text>
  <text x="127" y="647" text-anchor="middle" font-size="11">notes, drawings, transcripts</text>
  <rect x="250" y="592" width="215" height="84" fill="#e8e8e8" stroke="#888"/>
  <text x="357" y="615" text-anchor="middle" font-weight="bold">Worker worktrees</text>
  <text x="357" y="632" text-anchor="middle" font-size="11">&lt;repo&gt;.workers/&lt;name&gt;/ per discussion</text>
  <text x="357" y="647" text-anchor="middle" font-size="11">&lt;repo&gt;.worker/ (brainstorms)</text>
  <text x="357" y="662" text-anchor="middle" font-size="11">need Git · not a sandbox</text>
  <rect x="480" y="592" width="215" height="84" fill="#e8e8e8" stroke="#888"/>
  <text x="587" y="615" text-anchor="middle" font-weight="bold">Local state (this computer)</text>
  <text x="587" y="632" text-anchor="middle" font-size="11">~/.config/…/defaults.json</text>
  <text x="587" y="647" text-anchor="middle" font-size="11">~/.local/state/…/paused/, programs/</text>
  <text x="587" y="662" text-anchor="middle" font-size="11">~/.local/share/…/notes/</text>
  <rect x="710" y="592" width="270" height="84" fill="#e8e8e8" stroke="#888"/>
  <text x="845" y="615" text-anchor="middle" font-weight="bold">Replication store (optional)</text>
  <text x="845" y="632" text-anchor="middle" font-size="11">&lt;root&gt;/.agent-room/store.git</text>
  <text x="845" y="647" text-anchor="middle" font-size="11">→ peer servers over HTTP</text>
  <line x1="420" y1="555" x2="420" y2="590" stroke="#444" marker-end="url(#a)"/>
  <line x1="700" y1="330" x2="400" y2="590" stroke="#b07a1f" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="690" y1="330" x2="150" y2="590" stroke="#b07a1f" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="680" y="450" font-size="10" fill="#b07a1f">agents read/write files directly</text>
  <text x="680" y="463" font-size="10" fill="#b07a1f">(working directory: the room root for discussion</text>
  <text x="680" y="476" font-size="10" fill="#b07a1f">agents, the lane's worktree for the worker;</text>
  <text x="680" y="489" font-size="10" fill="#b07a1f">full file access)</text>

  <!-- Legend -->
  <rect x="20" y="695" width="960" height="60" fill="#fafafa" stroke="#ccc"/>
  <text x="35" y="718" font-weight="bold">Legend</text>
  <rect x="110" y="707" width="16" height="16" fill="#1168bd"/><text x="132" y="720">harness code (enforces)</text>
  <rect x="300" y="707" width="16" height="16" fill="#999"/><text x="322" y="720">external system</text>
  <rect x="450" y="707" width="16" height="16" fill="#e8e8e8" stroke="#888"/><text x="472" y="720">storage</text>
  <text x="560" y="720" fill="#b07a1f">amber = agent side: role instructions + optional skills (asked)</text>
  <text x="35" y="742" font-size="11" fill="#666">Simplified: arrows show main flows only; title generation, Dock launcher and terminal mode omitted.</text>
</svg>
