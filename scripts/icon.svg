<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px rounded square, centred -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- the shared document -->
  <g filter="url(#shadow)">
    <path d="M250 230 H530 L630 330 V790 H250 Z" fill="#f8fafc"/>
    <path d="M530 230 V330 H630 Z" fill="#cbd5e1"/>
  </g>
  <g stroke="#94a3b8" stroke-width="22" stroke-linecap="round">
    <line x1="305" y1="400" x2="575" y2="400"/>
    <line x1="305" y1="470" x2="545" y2="470"/>
    <line x1="305" y1="540" x2="575" y2="540"/>
    <line x1="305" y1="610" x2="490" y2="610"/>
    <line x1="305" y1="680" x2="545" y2="680"/>
  </g>

  <!-- two agents talking about it -->
  <g filter="url(#shadow)">
    <path d="M560 300 h220 a60 60 0 0 1 60 60 v110 a60 60 0 0 1 -60 60 h-120 l-60 55 v-55 h-40 a60 60 0 0 1 -60 -60 v-110 a60 60 0 0 1 60 -60 Z" fill="url(#blue)"/>
  </g>
  <g fill="#fff">
    <circle cx="610" cy="415" r="22"/><circle cx="670" cy="415" r="22"/><circle cx="730" cy="415" r="22"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M520 600 h220 a60 60 0 0 1 60 60 v90 a60 60 0 0 1 -60 60 h-40 v55 l-60 -55 h-120 a60 60 0 0 1 -60 -60 v-90 a60 60 0 0 1 60 -60 Z" fill="url(#purple)"/>
  </g>
  <g stroke="#fff" stroke-width="20" stroke-linecap="round">
    <line x1="560" y1="675" x2="760" y2="675"/>
    <line x1="560" y1="735" x2="700" y2="735"/>
  </g>
</svg>
